<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Угадай число</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {width: 500px;}
        .row { display: flex; gap: 8px; margin: 16px 0; }
        .row input { flex: 1; }
        #result { text-align: center; font-size: 18px; font-weight: bold; min-height: 26px; }
    </style>
</head>
<body>
    <h1>Угадай число от 1 до 100</h1>
    <div class="row">
        <input id="number" type="number" min="1" max="100" placeholder="Число...">
        <button onclick="check()">Проверить</button>
    </div>
    <div id="result"></div>
    <script>
        let secret = Math.floor(Math.random() * 100) + 1;
        const get = id => document.getElementById(id);

        const check = () => {
            const val = Number(get('number').value);
            if (!val || val < 1 || val > 100) { alert('Введи число от 1 до 100'); return; }
            if (val === secret) {
                get('result').textContent = 'Угадал!';
                secret = Math.floor(Math.random() * 100) + 1;
                get('number').value = '';
            } else {
                get('result').textContent = val < secret ? '↑ Больше' : '↓ Меньше';
            }
        };

        get('number').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    </script>
</body>
</html>
